<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCheck PRO - Auditoria de Segurança</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="CyberCheck PRO - Plataforma de Auditoria de Segurança Digital">

    <!-- Favicon -->
    <link rel="icon" href="../imagens/dark-theme/logo.png">

    <!-- Font Awesome com segurança e integridade -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="" crossorigin="anonymous">

    <!-- Caminhos corretos dos arquivos CSS -->
    <link rel="stylesheet" href="../styles-dark/normalize.css">
    <link rel="stylesheet" href="../styles-dark/global.css">
    <link rel="stylesheet" href="../styles-dark/cards.css">
    <link rel="stylesheet" href="../styles-dark/hero.css">
    <link rel="stylesheet" href="../styles-dark/audit.css">
    <link rel="stylesheet" href="../styles-dark/mobile.css">
    <link rel="stylesheet" href="../styles-dark/desktop.css">
</head>
<body data-theme="dark">
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <h1>
                <a href="../dashboard/dashboard.html" style="text-decoration: none; color: inherit;">
                    <i class="fa-solid fa-shield-halved"></i> CyberCheck PRO
                </a>
            </h1>
            <h2>Auditoria de Segurança</h2>
        </header>

        <!-- Menu de Navegação Global -->
        <nav class="main-nav">
            <a href="../dashboard/dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="../audit/audit.html" class="active"><i class="fa-solid fa-magnifying-glass-chart"></i> Auditoria</a>
            <a href="../reports/reports.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
            <a href="../history/history.html"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
        </nav>

        <hr>

        <!-- Status da API dinâmico para o JS -->
        <div id="api-status">
            <p id="apiStatus"><i class="fa-solid fa-circle-notch fa-spin"></i> Verificando API...</p>
            <div id="apiVersion">Versão: --</div>
            <p id="backendType">Backend: --</p>
        </div>

        <hr>

        <!-- Campo URL otimizado -->
        <div class="input-group">
            <label for="urlInput"><i class="fa-solid fa-globe"></i> Domínio ou URL Alvo</label>
            <div class="input-wrapper">
                <input 
                    id="urlInput"
                    type="url"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="https://google.com"
                    required
                >
                <button onclick="runAudit()">
                    <i class="fa-solid fa-play"></i> Executar Auditoria
                </button>
            </div>
        </div>

        <hr>

        <!-- Indicadores rápidos -->
        <div id="summary">
            <span id="scoreLabel">Security Score</span>
            <div class="score-circle" id="scoreValue">--</div>
            <h2 id="gradeValue">Aguardando Auditoria</h2>
            <span id="riskValue" class="risk-badge">READY</span>
        </div>

        <hr>

        <!-- Loading -->
        <div id="loading" style="display: none;">
            <i class="fa-solid fa-spinner fa-spin"></i> Analisando alvo...
        </div>

        <!-- Área de resultados organizada com IDs preparados para o JS -->
        <div id="audit-results">
            <div id="ssl-result">
                <div id="sslStatus"></div>
            </div>
            <div id="whois-result">
                <div id="whoisStatus"></div>
            </div>
            <div id="technology-result">
                <div id="technologyList"></div>
            </div>
            <div id="recon-result"></div>
            <div id="dns-result">
                <div id="dnsStatus"></div>
            </div>
            <div id="headers-result">
                <div id="headersStatus"></div>
            </div>
        </div>

        <hr>

        <!-- Histórico rápido em lista -->
        <div id="history-preview">
            <h3><i class="fa-solid fa-history"></i> Últimas Auditorias</h3>
            <ul id="historyList"></ul>
        </div>

        <hr>

        <!-- Botões de relatório -->
        <div id="report-buttons">
            <button id="exportPdf"><i class="fa-solid fa-file-pdf"></i> Gerar PDF</button>
            <button id="exportHtml"><i class="fa-solid fa-file-code"></i> Gerar HTML</button>
            <button id="exportCsv"><i class="fa-solid fa-file-csv"></i> Gerar CSV</button>
        </div>

        <hr>

        <!-- Seção de Resultado JSON para Debug -->
        <section class="json-section">
            <div class="audit-container">
                <h2><i class="fa-solid fa-code"></i> Resultado JSON</h2>
                <pre id="jsonResult">Aguardando auditoria...</pre>
            </div>
        </section>
    </div>

    <!-- Caminho do JavaScript -->
    <script src="audit.js"></script>
</body>
</html>
