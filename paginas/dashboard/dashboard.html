<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCheck PRO - Dashboard</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="CyberCheck PRO - Painel de Controle e Métricas de Segurança">

    <!-- Favicon -->
    <link rel="icon" href="../imagens/dark-theme/logo.png">

    <!-- Font Awesome com segurança e integridade -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="" crossorigin="anonymous">

    <!-- Caminhos corretos dos arquivos CSS -->
    <link rel="stylesheet" href="../styles-dark/normalize.css">
    <link rel="stylesheet" href="../styles-dark/global.css">
    <link rel="stylesheet" href="../styles-dark/cards.css">
    <link rel="stylesheet" href="../styles-dark/hero.css">
    <link rel="stylesheet" href="../styles-dark/dashboard.css">
    <link rel="stylesheet" href="../styles-dark/mobile.css">
    <link rel="stylesheet" href="../styles-dark/desktop.css">
</head>
<body data-theme="dark">
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <h1>
                <a href="../../index.html">
                    <i class="fa-solid fa-shield-halved"></i> CyberCheck PRO
                </a>
            </h1>
            <h2>Painel de Controle (Dashboard)</h2>
        </header>

        <!-- Menu de Navegação Global com Início -->
        <nav class="main-nav">
            <a href="../../index.html"><i class="fa-solid fa-house"></i> Início</a>
            <a href="../dashboard/dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="../audit/audit.html"><i class="fa-solid fa-magnifying-glass-chart"></i> Auditoria</a>
            <a href="../reports/reports.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
            <a href="../history/history.html"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
        </nav>

        <hr>

        <!-- Status do Sistema / API -->
        <div id="api-status">
            <p id="systemStatus"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando métricas do sistema...</p>
        </div>

        <hr>

        <!-- Métricas Principais (Cards) -->
        <div class="dashboard-metrics">
            <div class="dashboard-card">
                <h3><i class="fa-solid fa-magnifying-glass"></i> Total de Scans</h3>
                <p id="totalScans" class="metric-value">--</p>
            </div>
            <div class="dashboard-card">
                <h3><i class="fa-solid fa-file-shield"></i> Relatórios Gerados</h3>
                <p id="totalReports" class="metric-value">--</p>
            </div>
            <div class="dashboard-card">
                <h3><i class="fa-solid fa-clock"></i> Última Análise</h3>
                <p id="latestScan" class="metric-text">--</p>
            </div>
        </div>

        <hr>

        <!-- Seção de Relatórios em Tempo Real -->
        <section id="liveReports">
            <h2>
                <i class="fa-solid fa-file-lines"></i> Relatórios em Tempo Real
            </h2>
            <div id="reportsContainer">
                Carregando relatórios...
            </div>
        </section>

        <hr>

        <!-- Atalho Rápido para Auditoria -->
        <div class="dashboard-action">
            <a href="../audit/audit.html" class="btn-action">
                <i class="fa-solid fa-play"></i> Iniciar Nova Auditoria
            </a>
        </div>
    </div>

    <!-- Caminho do Script do Dashboard -->
    <script src="dashboard.js"></script>
</body>
</html>
