<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCheck PRO - Dashboard</title>

    <!-- CSS do Tema Dark -->
    <link rel="stylesheet" href="../../styles-dark/normalize.css">
    <link rel="stylesheet" href="../../styles-dark/global.css">
    <link rel="stylesheet" href="../../styles-dark/cards.css">
    <link rel="stylesheet" href="../../styles-dark/dashboard.css">
    <link rel="stylesheet" href="../../styles-dark/mobile.css">
    <link rel="stylesheet" href="../../styles-dark/desktop.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho com Logo redirecionando para o Index -->
    <header class="header">
        <div class="logo">
            <a href="../../index.html" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-shield-halved"></i>
                CyberCheck PRO
            </a>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Navegação / Abas do Sistema -->
        <div class="nav-tabs" style="display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color, #334155); padding-bottom: 16px; flex-wrap: wrap;">
            <a href="../../index.html" class="nav-tab"><i class="fa-solid fa-house"></i> Início</a>
            <a href="dashboard.html" class="nav-tab active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="../audit/audit.html" class="nav-tab"><i class="fa-solid fa-shield-halved"></i> Auditoria</a>
            <a href="../reports/reports.html" class="nav-tab"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
            <a href="../history/history.html" class="nav-tab"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
        </div>

        <!-- Cards de Estatísticas -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px;">
            <div class="stat-card">
                <i class="fa-solid fa-magnifying-glass-chart" style="font-size: 24px; color: var(--accent-cyan, #06b6d4); margin-bottom: 8px;"></i>
                <h3 style="font-size: 14px; color: var(--text-muted, #94a3b8); text-transform: uppercase; margin-bottom: 8px;">Total de Scans</h3>
                <div class="stat-value" id="total-scans" style="font-size: 28px; font-weight: bold; color: var(--text-main, #f8fafc);">--</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-file-pdf" style="font-size: 24px; color: var(--accent-cyan, #06b6d4); margin-bottom: 8px;"></i>
                <h3 style="font-size: 14px; color: var(--text-muted, #94a3b8); text-transform: uppercase; margin-bottom: 8px;">Relatórios Gerados</h3>
                <div class="stat-value" id="total-reports" style="font-size: 28px; font-weight: bold; color: var(--text-main, #f8fafc);">--</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-globe" style="font-size: 24px; color: var(--accent-cyan, #06b6d4); margin-bottom: 8px;"></i>
                <h3 style="font-size: 14px; color: var(--text-muted, #94a3b8); text-transform: uppercase; margin-bottom: 8px;">Última Análise</h3>
                <div class="stat-value" id="latest-scan" style="font-size: 20px; font-weight: bold; color: var(--text-main, #f8fafc); margin-top: 4px;">--</div>
            </div>
        </div>

        <!-- Seção de Relatórios em Tempo Real -->
        <div class="reports-section" style="background: var(--card-bg, #1e293b); border: 1px solid var(--border-color, #334155); border-radius: 14px; padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; color: var(--text-main, #f8fafc);">
                <i class="fa-solid fa-file-shield"></i>
                Relatórios em Tempo Real
            </h2>
            <div id="realtime-reports-container" style="color: var(--text-muted, #94a3b8);">
                Carregando relatórios...
            </div>
        </div>

        <!-- Botão de Ação Inferior -->
        <div class="action-container" style="text-align: center;">
            <a href="../audit/audit.html" class="btn-primary" style="background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                <i class="fa-solid fa-play"></i> Iniciar Nova Auditoria
            </a>
        </div>
    </main>

    <!-- Script do Dashboard (Certifique-se de que o arquivo js está na mesma pasta ou ajuste o caminho se necessário) -->
    <script src="dashboard.js"></script>
</body>
</html>
