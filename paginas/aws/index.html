<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Security Analyzer - Centro de Segurança IAM</title>

    <!-- Estilos globais (subindo 3 níveis até a raiz do projeto) -->
    <link rel="stylesheet" href="../../../styles/normalize.css">
    <link rel="stylesheet" href="../../../styles/global.css">
    <link rel="stylesheet" href="../../../styles/dark.css">
    <link rel="stylesheet" href="../../../styles/responsive.css">
    <link rel="stylesheet" href="iam.css">

    <!-- Ícones (Phosphor Icons) -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web">
</head>

<body>

    <div class="app-container">

        <!-- Sidebar / Menu Lateral Padronizado -->
        <aside class="sidebar">
            <div class="brand">
                <a href="../index.html"
                    style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
                    <i class="ph ph-shield-check brand-icon"></i>
                    <span class="brand-title">AWS Security</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="../index.html">
                            <i class="ph ph-cloud-arrow-up"></i>
                            <span>AWS Dashboard</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="./">
                            <i class="ph ph-users-three"></i>
                            <span>IAM</span>
                        </a>
                    </li>
                    <li>
                        <a href="../s3/">
                            <i class="ph ph-database"></i>
                            <span>S3</span>
                        </a>
                    </li>
                    <li>
                        <a href="../ec2/">
                            <i class="ph ph-cpu"></i>
                            <span>EC2</span>
                        </a>
                    </li>
                    <li>
                        <a href="../cloudtrail/">
                            <i class="ph ph-path"></i>
                            <span>CloudTrail</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="../../../index.html"
                    style="display: flex; align-items: center; gap: 8px; color: #8b949e; text-decoration: none;">
                    <i class="ph ph-house"></i>
                    <span>CyberCheck (Raiz)</span>
                </a>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">

            <!-- Cabeçalho Superior -->
            <header class="topbar">
                <div class="header-title">
                    <h1>Centro de Segurança IAM</h1>
                    <p class="subtitle">Auditoria proativa e gestão de riscos de identidades AWS</p>
                </div>

                <div class="account-indicators" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <a href="../index.html" class="btn-refresh"
                        style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 10px; border-radius: 6px; font-size: 13px;">
                        <i class="ph ph-cloud"></i> AWS Dashboard
                    </a>

                    <a href="../../../index.html" class="btn-refresh"
                        style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 10px; border-radius: 6px; font-size: 13px;">
                        <i class="ph ph-shield"></i> CyberCheck
                    </a>
                </div>
            </header>

            <!-- Conteúdo da Página -->
            <section class="cards-grid">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">Módulo IAM Ativo</span>
                        <i class="ph ph-users card-icon"></i>
                    </div>
                    <div class="card-body">
                        <span class="card-value" style="font-size: 18px; color: #58a6ff;">Padrão index.html configurado
                            com sucesso!</span>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="iam.js"></script>
</body>

</html>
